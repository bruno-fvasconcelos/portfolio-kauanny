name: Publicar portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar site e reunir animacao original
        run: |
          mkdir -p _site/assets
          cp ./*.html ./*.css ./*.js _site/
          cp assets/* _site/assets/
          cat assets/cases-noise-loop.gif.part* > _site/assets/cases-noise-loop.gif
          rm _site/assets/cases-noise-loop.gif.part*
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
